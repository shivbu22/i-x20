<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>Shivam Yadav — Ready Player Shiv</title><link rel="stylesheet" href="../src/style.css"><style>
body{min-width:320px;cursor:crosshair;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#24351d 0,transparent 22%),#09090d}.app-shell{position:relative;z-index:1}.hero,.page{position:relative}.route{animation:arrive .58s cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{opacity:0;transform:scale(.985) translateY(22px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}.orbital{position:fixed;z-index:0;pointer-events:none}.game-hud{position:fixed;z-index:30;inset:0;pointer-events:none;border:1px solid #c8ff3730}.game-hud:before,.game-hud:after{content:'';position:absolute;width:38px;height:38px;border-color:#c8ff37;border-style:solid}.game-hud:before{top:12px;left:12px;border-width:2px 0 0 2px}.game-hud:after{right:12px;bottom:12px;border-width:0 2px 2px 0}.game-hud .top{position:absolute;top:28px;left:30px;color:#c8ff37;font:10px/1.5 'DM Mono',monospace;letter-spacing:.11em}.game-hud .bottom{position:absolute;bottom:25px;left:30px;color:#a7a9af;font:9px 'DM Mono',monospace;letter-spacing:.08em}.key{border:1px solid #53565d;color:#f8f8f1;padding:4px 6px;margin:0 3px}.status-meter{position:fixed;right:30px;top:31px;width:145px;z-index:31;color:#c8ff37;font:9px 'DM Mono',monospace;letter-spacing:.08em}.meter{height:3px;background:#3b3e40;margin-top:6px}.meter i{display:block;height:100%;width:68%;background:#c8ff37;box-shadow:0 0 13px #c8ff37}.boot-screen,.pause-screen{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#08090bf4;padding:25px}.pause-screen{z-index:48}.boot-box{position:relative;width:min(620px,100%);padding:clamp(28px,6vw,58px);border:1px solid #c8ff37;box-shadow:0 0 75px #c8ff371f}.boot-box:after{content:'SHIV_OS // V.02';position:absolute;right:14px;top:12px;font:9px 'DM Mono',monospace;color:#c8ff37}.boot-box p{font:10px/1.6 'DM Mono',monospace;letter-spacing:.12em;color:#70ecff}.boot-box h1{font:800 clamp(2.5rem,7.5vw,5.5rem)/.88 Unbounded,sans-serif;letter-spacing:-.09em;margin:1.1rem 0;color:#f6f6ee}.boot-box h1 em{font-style:normal;color:#c8ff37}.boot-box button{margin-top:1rem;padding:16px 20px;border:0;background:#c8ff37;color:#08090b;font:11px 'DM Mono',monospace;letter-spacing:.1em;cursor:pointer}.boot-box button:hover{box-shadow:0 0 30px #c8ff3780}.skip{background:none!important;color:#c6c7c7!important;border:1px solid #555!important;margin-left:8px!important}.warp{position:fixed;z-index:45;inset:0;pointer-events:none;background:#c8ff37;clip-path:inset(0 100% 0 0);mix-blend-mode:screen}.warp.go{animation:warp .58s cubic-bezier(.77,0,.18,1)}@keyframes warp{0%{clip-path:inset(0 100% 0 0)}45%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}.mission{cursor:pointer;transform-style:preserve-3d;will-change:transform}.mission.active{outline:2px solid #c8ff37;outline-offset:-2px;background:#1a1d1a}.mission.active:before{content:'ACTIVE TARGET';position:absolute;right:1.7rem;bottom:1.7rem;color:#c8ff37;font:9px 'DM Mono',monospace;letter-spacing:.1em}.mission button{pointer-events:none}.mission-detail{border:1px solid #c8ff3755;background:#0d0f0e;padding:1.4rem 1.6rem;grid-column:1/-1;color:#b9bdba;min-height:120px}.mission-detail p{margin:.5rem 0 0;font:11px/1.5 'DM Mono',monospace}.mission-detail b{font:10px 'DM Mono',monospace;color:#70ecff;letter-spacing:.1em}.mission-detail strong{color:#c8ff37}.toast{position:fixed;z-index:60;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);opacity:0;background:#c8ff37;color:#08090b;padding:12px 16px;font:10px 'DM Mono',monospace;letter-spacing:.1em;transition:.28s}.toast.show{opacity:1;transform:translateX(-50%)}.unlock{position:fixed;right:25px;bottom:28px;z-index:58;width:245px;background:#111513;border:1px solid #c8ff37;padding:14px;transform:translateX(120%);transition:.42s cubic-bezier(.16,1,.3,1);font:10px/1.5 'DM Mono',monospace}.unlock.show{transform:none}.unlock b{display:block;color:#c8ff37;letter-spacing:.08em}.scanlines{position:fixed;inset:0;z-index:29;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,transparent 0 3px,#c8ff37 3px 4px)}.hero h1{animation:glitch 7s steps(1,end) infinite}@keyframes glitch{0%,94%,100%{text-shadow:none}95%{text-shadow:4px 0 #70ecff,-3px 0 #ff5976}96%{text-shadow:-3px 0 #70ecff,3px 0 #ff5976}}@media(max-width:700px){.game-hud .top{left:21px;top:77px}.game-hud .bottom{left:21px;font-size:8px}.status-meter{display:none}.game-hud:before{left:8px;top:8px}.game-hud:after{right:8px;bottom:8px}.mission-detail{min-height:145px}}@media(prefers-reduced-motion:reduce){.route,.warp.go,.hero h1{animation:none}.scanlines{display:none}.mission{transform:none!important}.orbital{display:none}}
</style></head><body><div id="app"></div><div class="warp" id="warp"></div><div class="scanlines"></div><div class="game-hud"><div class="top">PLAYER 01 / SHIVAM YADAV<br><span id="routeLabel">LAUNCH BAY</span></div><div class="bottom"><span class="key">←</span><span class="key">→</span> NAVIGATE <span class="key">M</span> MISSIONS <span class="key">P</span> PAUSE</div></div><div class="status-meter">FOUNDER XP <span id="xp">4200</span><div class="meter"><i id="meter"></i></div></div><div class="unlock" id="unlock"></div><div class="toast" id="toast"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let xp=4200,selected=0,started=false,cancelCore=()=>{};const routes=['/','/missions','/profile','/contact'];
const projects=[['KissanCare','AI FOR AGRICULTURE','SHIPPED','85%','Farmer advisory chatbot with an NLP classifier across six categories and three agronomic APIs.','Python · NLP · REST APIs','SIH 2024 institutional shortlist from 200+ teams.'],['Edwizer','AI EDTECH','LIVE BUILD','6','Personalized learning platform designed from discovery to deployment with a multi-tier backend.','React · Node.js · Python','Led a cross-functional team of six engineers.'],['Swachta','CIVIC TECH','MVP','45%','Smart-city waste intelligence that detects hotspots and routes SLA-based sanitation tickets.','Computer Vision · Geo-tagging · Product','Targeting a ~45% faster resolution turnaround.'],['Autonomous RAG','AI AGENTS','SYSTEM','RAG','Context-aware workflows for resume parsing, candidate matching, and learning schedules.','LangChain · LLMs · RAG','Orchestrates job-application and skill-growth workflows.'],['Medimin','HEALTH INTELLIGENCE','IN PROGRESS','01','A comparison engine for medicine prices, composition, benefits, and side effects.','Research · Product · AI','Concept-stage mission; not presented as deployed.'],['Quick Queue','SYSTEM DESIGN','IN PROGRESS','∞','Slot-based queue management aimed at turning waiting time into useful time.','Scheduling · UX · Systems','Concept-stage mission; not presented as deployed.']];
const header=()=>`<header><a class="mark" href="#/">S<span>Y</span><i></i></a><nav><a href="#/">LAUNCH</a><a href="#/missions">MISSIONS</a><a href="#/profile">PROFILE</a><a href="#/contact">COMMS</a></nav><span class="signal">◉ ONLINE</span></header>`;const footer=()=>`<footer><span>SHIVAM YADAV / BUILDER PROFILE</span><span>INDIA · 2026</span></footer>`;
const home=()=>`<section class="hero route"><div class="hero-copy"><p class="system">SYSTEM BOOTED <b>•</b> PLAYER 01</p><h1>SHIVAM<br><em>YADAV</em></h1><p class="intro">Founder, technical builder, and B.Tech AI/ML student turning complex problems into products people can use.</p><div class="actions"><a class="primary" href="#/missions">ENTER MISSION LOG <span>↗</span></a><a class="secondary" href="https://github.com/shivbu22" target="_blank">GITHUB</a></div></div><div class="orbital" id="orbital"></div><div class="hero-meta"><span>GREATER NOIDA / GHAZIABAD</span><span>MOVE POINTER TO STEER AI CORE</span></div></section><section class="statline route"><div><strong>03</strong><span>VENTURES<br>IN MOTION</span></div><div><strong>85%</strong><span>NLP MODEL<br>ACCURACY</span></div><div><strong>150+</strong><span>DSA PROBLEMS<br>SOLVED</span></div><div><strong>06</strong><span>ENGINEERS<br>LED</span></div></section><section class="manifesto route"><p>“I don’t collect side projects.<br><b>I ship missions.</b>”</p><a href="#/profile">VIEW PLAYER PROFILE <span>→</span></a></section>`;
const missions=()=>`<section class="page route"><div class="page-title"><p class="system">MISSION SELECT / 06</p><h2>BUILT TO<br><em>MOVE.</em></h2><p>Choose a mission with the mouse or arrow keys. Enter acquires the selected mission log.</p></div><div class="missions" id="missions">${projects.map((p,i)=>`<article class="mission ${i===selected?'active':''}" data-i="${i}" tabindex="0"><div class="mission-top"><span>${String(i+1).padStart(2,'0')} / ${p[1]}</span><b class="${p[2].includes('PROGRESS')?'pending':''}">${p[2]}</b></div><div class="mission-stat">${p[3]}</div><h3>${p[0]}</h3><p>${p[4]}</p><div class="tags">${p[5].split(' · ').map(x=>`<span>${x}</span>`).join('')}</div><small>${p[6]}</small><button>SELECT <span>↗</span></button></article>`).join('')}<div class="mission-detail" id="detail"></div></div></section>`;
const profile=()=>`<section class="page profile route"><div class="page-title"><p class="system">PLAYER PROFILE / 01</p><h2>BUILDING<br><em>THE NEXT.</em></h2></div><div class="profile-grid"><aside><div class="avatar">SY</div><p>SHIVAM “SHIV” YADAV</p><span>APM · AI / TECHNICAL PRODUCT</span><hr><span>LEVEL 04 / B.TECH AI & ML</span><span>LLOYD INSTITUTE · 2027</span><span>CGPA 8.2</span></aside><article><p class="lead">A founder-first engineer who connects user insight, systems thinking, and hands-on building.</p><p>Shiv is pursuing B.Tech in AI/ML while building ventures across civic-tech, edtech, and AI tooling. His work moves from research and positioning through architecture, deployment, and iteration.</p><div class="experience"><div><b>FOUNDER & TECHNICAL LEAD</b><span>SWACHTA / CIVIC TECH</span><p>Built a smart-city MVP with computer vision and SLA-based routing for waste hotspot resolution.</p></div><div><b>FOUNDER & TECHNICAL LEAD</b><span>EDWIZER / JAN 2025 — PRESENT</span><p>Owned 0→1 lifecycle, live deployment, and bi-weekly execution for AI-driven learning.</p></div><div><b>AI INTERN</b><span>VELOCITIQ TECHNOLOGIES / 2025</span><p>Completed remote AI internship alongside founder work.</p></div></div></article></div><div class="ability-grid"><div class="ability"><span>AI / ML</span><p>Python · LLMs · RAG · LangChain · PyTorch · TensorFlow · HuggingFace · OpenAI API</p></div><div class="ability"><span>PRODUCT SYSTEMS</span><p>Discovery · PRDs · RICE · GTM · Agile · CI/CD · Product strategy</p></div><div class="ability"><span>BUILD</span><p>React · Next.js · React Native · FastAPI · Node.js · Tailwind · RBAC</p></div><div class="ability"><span>DATA / INFRA</span><p>SQL · Pandas · Supabase · MySQL · Docker · Cloudflare Workers · D1 · KV</p></div></div><section class="awards"><h3>ACHIEVEMENT CACHE</h3><ul><li>SIH 2024 institutional shortlist for KissanCare, chosen from 200+ teams.</li><li>150+ DSA problems solved; active GeeksforGeeks Chapter member.</li><li>Six certifications across product, business, AI, ML, Python, and SQL.</li></ul></section><section class="certs"><h3>CERTIFICATION INVENTORY</h3><p>Brand Building 101 · AI for Business Leaders · Product Management: Vision, Roadmap & Strategy · Machine Learning A–Z · Python for Data Science & AI · Introduction to SQL</p></section></section>`;
const contact=()=>`<section class="contact page route"><p class="system">COMMUNICATIONS UPLINK</p><h2>LET’S BUILD<br><em>SOMETHING REAL.</em></h2><p class="contact-copy">Have a hard problem, a product to ship, or an ambitious AI workflow to design? Send the signal.</p><div class="contact-links"><a href="https://www.linkedin.com/in/shivbu22" target="_blank">LINKEDIN <span>↗</span></a><a href="https://github.com/shivbu22" target="_blank">GITHUB <span>↗</span></a></div><p class="note">Direct email contact can be added when provided.</p></section>`;
function label(r){return {'/':'LAUNCH BAY','/missions':'MISSION SELECT','/profile':'PLAYER PROFILE','/contact':'COMMS UPLINK'}[r]||'LAUNCH BAY'}function updateHUD(r){document.querySelector('#routeLabel').textContent=label(r);document.querySelector('#xp').textContent=xp;document.querySelector('#meter').style.width=Math.min(96,58+Math.floor((xp-4200)/20))+'%'}function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}function unlock(t){let el=document.querySelector('#unlock');el.innerHTML='<b>ACHIEVEMENT UNLOCKED</b>'+t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}function updateDetail(){let p=projects[selected],d=document.querySelector('#detail');if(!d)return;d.innerHTML=`<b>TARGET ${String(selected+1).padStart(2,'0')} / ${p[0].toUpperCase()}</b><p><strong>MISSION INTEL:</strong> ${p[6]} Press ENTER to acquire this project record.</p>`;document.querySelectorAll('.mission').forEach((x,i)=>x.classList.toggle('active',i===selected))}function choose(i,acquire=false){selected=i;updateDetail();let card=document.querySelector('.mission[data-i="'+i+'"]');card?.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});if(acquire){xp+=25;updateHUD('/missions');toast('MISSION ACQUIRED // '+projects[i][0].toUpperCase());unlock('+25 FOUNDER XP // '+projects[i][1])}}function bindMissions(){updateDetail();document.querySelectorAll('.mission').forEach(card=>{let i=+card.dataset.i;card.addEventListener('click',()=>choose(i,true));card.addEventListener('pointermove',e=>{if(reduced)return;let r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(850px) rotateX(${y*-4}deg) rotateY(${x*5}deg) translateZ(7px)`});card.addEventListener('pointerleave',()=>card.style.transform='')})}function render(){cancelCore();let r=location.hash.slice(1)||'/';let content=r==='/missions'?missions():r==='/profile'?profile():r==='/contact'?contact():home();document.querySelector('#app').innerHTML=`<main class="app-shell">${header()}${content}${footer()}</main>`;updateHUD(r);if(r==='/')core();if(r==='/missions')bindMissions()}function navigate(r){if((location.hash.slice(1)||'/')===r)return;document.querySelector('#warp').classList.remove('go');void document.querySelector('#warp').offsetWidth;document.querySelector('#warp').classList.add('go');setTimeout(()=>location.hash=r,180)}function core(){let e=document.querySelector('#orbital');if(!e||reduced)return;let s=new THREE.Scene(),c=new THREE.PerspectiveCamera(54,1,.1,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});c.position.z=5;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(e.clientWidth,e.clientHeight);e.append(renderer.domElement);let group=new THREE.Group(),target={x:0,y:0};s.add(group);let core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,2),new THREE.MeshBasicMaterial({color:0xc8ff37,wireframe:true}));group.add(core);let rings=[1.42,1.74,2.05].map((r,i)=>{let q=new THREE.Mesh(new THREE.TorusGeometry(r,.012,10,90),new THREE.MeshBasicMaterial({color:i===1?0x70ecff:0xc8ff37}));q.rotation.x=i*.8+.2;q.rotation.y=i*.52;group.add(q);return q});let alive=true,frame;function tick(){if(!alive)return;frame=requestAnimationFrame(tick);group.rotation.y+=(target.x-group.rotation.y)*.025+.003;group.rotation.x+=(target.y-group.rotation.x)*.025;rings.forEach((q,i)=>q.rotation.z+=.005*(i+1));core.rotation.x+=.002;renderer.render(s,c)}let move=ev=>{target.x=(ev.clientX/innerWidth-.5)*.7;target.y=(ev.clientY/innerHeight-.5)*.4};addEventListener('pointermove',move);tick();cancelCore=()=>{alive=false;cancelAnimationFrame(frame);removeEventListener('pointermove',move);renderer.dispose()}}
addEventListener('hashchange',render);addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX/innerWidth*100+'%');document.documentElement.style.setProperty('--my',e.clientY/innerHeight*100+'%')});addEventListener('keydown',e=>{if(!started){if(e.key==='Enter'||e.key===' '){started=true;document.querySelector('.boot-screen')?.remove();toast('PLAYER PROFILE UNLOCKED')}return}if(e.key.toLowerCase()==='p'){pause();return}if(e.key.toLowerCase()==='m'){navigate('/missions');return}let r=location.hash.slice(1)||'/';if(r==='/missions'){if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();choose((selected+1)%projects.length)}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();choose((selected-1+projects.length)%projects.length)}if(e.key==='Enter')choose(selected,true);return}if(e.key==='ArrowRight')navigate(routes[(routes.indexOf(r)+1)%routes.length]);if(e.key==='ArrowLeft')navigate(routes[(routes.indexOf(r)-1+routes.length)%routes.length])});function boot(){let b=document.createElement('div');b.className='boot-screen';b.innerHTML='<div class="boot-box"><p>INITIALISING PORTFOLIO.EXE</p><h1>READY<br>PLAYER <em>SHIV</em></h1><p>MOVE THROUGH PROJECT MISSIONS. ACQUIRE WORK. LEARN THE BUILDER’S STORY.</p><button id="start">PRESS START</button><button class="skip" id="skip">SKIP INTRO</button></div>';document.body.append(b);b.querySelector('#start').onclick=b.querySelector('#skip').onclick=()=>{started=true;b.remove();toast('SYSTEM ONLINE // EXPLORE FREELY')}}function pause(){let p=document.createElement('div');p.className='pause-screen';p.innerHTML='<div class="boot-box"><p>SYSTEM PAUSED</p><h1>TAKE A<br><em>BREATH.</em></h1><p>YOUR PROGRESS IS PRESERVED IN THIS SESSION.</p><button>RESUME</button></div>';document.body.append(p);p.querySelector('button').onclick=()=>p.remove()}render();boot();
</script></body></html>
