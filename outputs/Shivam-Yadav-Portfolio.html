<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shivam Yadav — Builder Profile</title><link rel="stylesheet" href="../src/style.css"><style>body{min-width:320px}.orbital{position:fixed;z-index:0;pointer-events:none}.app-shell{position:relative;z-index:1}.hero,.page{position:relative}.route{animation:boot .65s cubic-bezier(.16,1,.3,1)}@keyframes boot{from{opacity:0;transform:translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}.mission button{pointer-events:none}.standalone-note{position:fixed;right:14px;bottom:14px;z-index:20;background:#c8ff37;color:#09090d;padding:8px 10px;font:9px 'DM Mono',monospace}</style></head><body><div id="app"></div><span class="standalone-note">STANDALONE BUILD / ONLINE</span><script type="module">

const header=()=>`<header><a class="mark" href="#/">S<span>Y</span><i></i></a><nav><a href="#/">LAUNCH</a><a href="#/missions">MISSIONS</a><a href="#/profile">PROFILE</a><a href="#/contact">COMMS</a></nav><span class="signal">◉ ONLINE</span></header>`;
const footer=()=>`<footer><span>SHIVAM YADAV / BUILDER PROFILE</span><span>INDIA · 2026</span></footer>`;
const home=()=>`<section class="hero route"><div class="hero-copy"><p class="system">SYSTEM BOOTED <b>•</b> PLAYER 01</p><h1>SHIVAM<br><em>YADAV</em></h1><p class="intro">Founder, technical builder, and B.Tech AI/ML student turning complex problems into products people can use.</p><div class="actions"><a class="primary" href="#/missions">ENTER MISSION LOG <span>↗</span></a><a class="secondary" href="https://github.com/shivbu22">GITHUB</a></div></div><div class="orbital" id="orbital"></div><div class="hero-meta"><span>GREATER NOIDA / GHAZIABAD</span><span>FOUNDER MODE: ACTIVE</span></div></section><section class="statline route"><div><strong>03</strong><span>VENTURES<br>IN MOTION</span></div><div><strong>85%</strong><span>NLP MODEL<br>ACCURACY</span></div><div><strong>150+</strong><span>DSA PROBLEMS<br>SOLVED</span></div><div><strong>06</strong><span>ENGINEERS<br>LED</span></div></section><section class="manifesto route"><p>“I don’t collect side projects.<br><b>I ship missions.</b>”</p><a href="#/profile">VIEW PLAYER PROFILE <span>→</span></a></section>`;
const missions=()=>`<section class="page route"><div class="page-title"><p class="system">MISSION SELECT / 06</p><h2>BUILT TO<br><em>MOVE.</em></h2><p>Each project is a problem space explored with technical depth and product intent.</p></div><div class="missions">${P.map((p,i)=>`<article class="mission"><div class="mission-top"><span>${String(i+1).padStart(2,'0')} / ${p[1]}</span><b class="${p[2].includes('PROGRESS')?'pending':''}">${p[2]}</b></div><div class="mission-stat">${p[3]}</div><h3>${p[0]}</h3><p>${p[4]}</p><div class="tags">${p[5].split(' · ').map(x=>`<span>${x}</span>`).join('')}</div><small>${p[6]}</small><button>EXPLORE <span>↗</span></button></article>`).join('')}</div></section>`;
const profile=()=>`<section class="page profile route"><div class="page-title"><p class="system">PLAYER PROFILE / 01</p><h2>BUILDING<br><em>THE NEXT.</em></h2></div><div class="profile-grid"><aside><div class="avatar">SY</div><p>SHIVAM “SHIV” YADAV</p><span>APM · AI / TECHNICAL PRODUCT</span><hr><span>LEVEL 04 / B.TECH AI & ML</span><span>LLOYD INSTITUTE · 2027</span><span>CGPA 8.2</span></aside><article><p class="lead">A founder-first engineer who connects user insight, systems thinking, and hands-on building.</p><p>Shiv is pursuing B.Tech in AI/ML while building ventures across civic-tech, edtech, and AI tooling. His work moves from research and positioning through architecture, deployment, and iteration.</p><div class="experience"><div><b>FOUNDER & TECHNICAL LEAD</b><span>SWACHTA / CIVIC TECH</span><p>Built a smart-city MVP with computer vision and SLA-based routing for waste hotspot resolution.</p></div><div><b>FOUNDER & TECHNICAL LEAD</b><span>EDWIZER / JAN 2025 — PRESENT</span><p>Owned 0→1 lifecycle, live deployment, and bi-weekly execution for AI-driven learning.</p></div><div><b>AI INTERN</b><span>VELOCITIQ TECHNOLOGIES / 2025</span><p>Completed remote AI internship alongside founder work.</p></div></div></article></div><div class="ability-grid"><div class="ability"><span>AI / ML</span><p>Python · LLMs · RAG · LangChain · PyTorch · TensorFlow · HuggingFace · OpenAI API</p></div><div class="ability"><span>PRODUCT SYSTEMS</span><p>Discovery · PRDs · RICE · GTM · Agile · CI/CD · Product strategy</p></div><div class="ability"><span>BUILD</span><p>React · Next.js · React Native · FastAPI · Node.js · Tailwind · RBAC</p></div><div class="ability"><span>DATA / INFRA</span><p>SQL · Pandas · Supabase · MySQL · Docker · Cloudflare Workers · D1 · KV</p></div></div><section class="awards"><h3>ACHIEVEMENT CACHE</h3><ul><li>SIH 2024 institutional shortlist for KissanCare, chosen from 200+ teams.</li><li>150+ DSA problems solved; active GeeksforGeeks Chapter member.</li><li>Six certifications across product, business, AI, ML, Python, and SQL.</li></ul></section><section class="certs"><h3>CERTIFICATION INVENTORY</h3><p>Brand Building 101 · AI for Business Leaders · Product Management: Vision, Roadmap & Strategy · Machine Learning A–Z · Python for Data Science & AI · Introduction to SQL</p></section></section>`;
const contact=()=>`<section class="contact page route"><p class="system">COMMUNICATIONS UPLINK</p><h2>LET’S BUILD<br><em>SOMETHING REAL.</em></h2><p class="contact-copy">Have a hard problem, a product to ship, or an ambitious AI workflow to design? Send the signal.</p><div class="contact-links"><a href="https://www.linkedin.com/in/shivbu22">LINKEDIN <span>↗</span></a><a href="https://github.com/shivbu22">GITHUB <span>↗</span></a></div><p class="note">Direct email contact can be added when provided.</p></section>`;
function render(){let r=location.hash.slice(1)||'/';let content=r==='/missions'?missions():r==='/profile'?profile():r==='/contact'?contact():home();document.querySelector('#app').innerHTML=`<main class="app-shell">${header()}${content}${footer()}</main>`;if(r==='/')core()}
function core(){const e=document.querySelector('#orbital');if(!e)return;const s=new THREE.Scene(),c=new THREE.PerspectiveCamera(54,1,.1,100),x=new THREE.WebGLRenderer({alpha:true,antialias:true});c.position.z=5;x.setPixelRatio(Math.min(devicePixelRatio,2));x.setSize(e.clientWidth,e.clientHeight);e.append(x.domElement);let g=new THREE.Group();s.add(g);g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,2),new THREE.MeshBasicMaterial({color:0xc8ff37,wireframe:true})));[1.42,1.74,2.05].forEach((r,i)=>{let q=new THREE.Mesh(new THREE.TorusGeometry(r,.012,10,90),new THREE.MeshBasicMaterial({color:i===1?0x70ecff:0xc8ff37}));q.rotation.x=i*.8+.2;q.rotation.y=i*.52;g.add(q)});let a=()=>{g.rotation.y+=.004;requestAnimationFrame(a);x.render(s,c)};a()}
addEventListener('hashchange',render);render();
</script><style>.game-hud{position:fixed;z-index:30;inset:0;pointer-events:none;border:1px solid #c8ff3733}.game-hud:before,.game-hud:after{content:'';position:absolute;width:36px;height:36px;border-color:#c8ff37;border-style:solid}.game-hud:before{left:14px;top:14px;border-width:2px 0 0 2px}.game-hud:after{right:14px;bottom:14px;border-width:0 2px 2px 0}.hud-top{position:absolute;left:30px;top:30px;font:10px 'DM Mono',monospace;color:#c8ff37;letter-spacing:.12em}.hud-bottom{position:absolute;left:30px;bottom:25px;font:9px 'DM Mono',monospace;color:#a7a9af;letter-spacing:.08em}.controls{display:flex;gap:8px;align-items:center}.key{border:1px solid #555963;color:#f8f8f3;padding:4px 6px;font:10px 'DM Mono',monospace}.boot-screen{position:fixed;inset:0;z-index:50;background:#08090b;display:grid;place-items:center;padding:30px;overflow:hidden}.boot-screen:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,#c8ff371c,transparent 35%)}.boot-box{position:relative;width:min(600px,100%);border:1px solid #c8ff37;padding:clamp(24px,6vw,54px);box-shadow:0 0 70px #c8ff3718}.boot-box:after{content:'SHIV_OS // V.01';position:absolute;right:14px;top:12px;color:#c8ff37;font:9px 'DM Mono',monospace}.boot-box p{font:10px 'DM Mono',monospace;color:#72efff;letter-spacing:.12em}.boot-box h1{font:800 clamp(2.5rem,7vw,5rem)/.9 Unbounded,sans-serif;letter-spacing:-.08em;margin:1rem 0;color:#f8f8f3}.boot-box h1 em{color:#c8ff37;font-style:normal}.boot-box button{border:0;background:#c8ff37;color:#08090b;padding:16px 20px;font:11px 'DM Mono',monospace;letter-spacing:.1em;cursor:pointer;margin-top:1rem}.boot-box button:hover{box-shadow:0 0 35px #c8ff3770}.mission{cursor:pointer}.mission.active{outline:2px solid #c8ff37;outline-offset:-2px;background:#1b1e1d}.mission.active:before{content:'SELECTED';position:absolute;right:1.5rem;bottom:1.5rem;color:#c8ff37;font:9px 'DM Mono',monospace;letter-spacing:.1em}.toast{position:fixed;z-index:40;left:50%;bottom:70px;transform:translateX(-50%) translateY(25px);opacity:0;background:#c8ff37;color:#08090b;padding:12px 16px;font:10px 'DM Mono',monospace;letter-spacing:.1em;transition:.3s}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:700px){.hud-top{left:22px;top:82px}.hud-bottom{left:22px}.boot-box{padding:32px 24px}.game-hud:before{left:8px;top:8px}.game-hud:after{right:8px;bottom:8px}}</style><script>let started=false,selected=0;const routes=['/','/missions','/profile','/contact'];function boot(){if(started)return;started=true;document.querySelector('.boot-screen')?.remove();toast('PLAYER PROFILE UNLOCKED // USE ARROW KEYS + ENTER')}function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.append(t)}t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function selectMission(d=0){let cards=[...document.querySelectorAll('.mission')];if(!cards.length)return;selected=(selected+d+cards.length)%cards.length;cards.forEach((x,i)=>x.classList.toggle('active',i===selected));cards[selected].scrollIntoView({behavior:'smooth',block:'center'})}function injectHUD(){document.querySelector('.game-hud')?.remove();document.querySelector('.boot-screen')?.remove();let h=document.createElement('div');h.className='game-hud';h.innerHTML='<div class="hud-top">PLAYER 01 / SHIVAM YADAV<br>XP 04200 / FOUNDER CLASS</div><div class="hud-bottom"><div class="controls"><span class="key">←</span><span class="key">→</span> NAVIGATE <span class="key">ENTER</span> SELECT <span class="key">M</span> MISSIONS</div></div>';document.body.append(h);if(!started){let b=document.createElement('div');b.className='boot-screen';b.innerHTML='<div class="boot-box"><p>INITIALISING PORTFOLIO.EXE</p><h1>READY<br>PLAYER <em>SHIV</em></h1><p>MISSION-DRIVEN AI / PRODUCT BUILDER<br>PRESS START TO ENTER THE SYSTEM.</p><button id="start">PRESS START</button></div>';document.body.append(b);b.querySelector('#start').onclick=boot}document.querySelectorAll('.mission').forEach((x,i)=>x.onclick=()=>{selected=i;selectMission();toast('MISSION DATA ACQUIRED // '+x.querySelector('h3').textContent.toUpperCase())})}document.addEventListener('keydown',e=>{if(!started){if(e.key==='Enter'||e.key===' ')boot();return}if(e.key.toLowerCase()==='m'){location.hash='/missions';return}if(location.hash==='#/missions'){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();selectMission(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();selectMission(-1)}if(e.key==='Enter'){let c=document.querySelectorAll('.mission')[selected];if(c)toast('MISSION DATA ACQUIRED // '+c.querySelector('h3').textContent.toUpperCase());return}}if(e.key==='ArrowRight'){location.hash=routes[(routes.indexOf(location.hash.slice(1))+1)%routes.length]}if(e.key==='ArrowLeft'){location.hash=routes[(routes.indexOf(location.hash.slice(1))-1+routes.length)%routes.length]}});const originalRender=window.render;const watcher=setInterval(()=>{if(document.querySelector('.app-shell')){injectHUD();clearInterval(watcher)}},40);</script></body></html>
